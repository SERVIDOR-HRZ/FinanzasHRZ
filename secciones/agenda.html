<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>Agenda — FinanzasHRZ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../elementos/css/style.css?v=20261027j" />
  <link rel="stylesheet" href="../elementos/css/cuentas.css?v=20261027j" />
  <link rel="stylesheet" href="../elementos/css/movimientos.css?v=20261027j" />
  <link rel="stylesheet" href="../elementos/css/categorias.css?v=20261027j" />
  <link rel="stylesheet" href="../elementos/css/agenda.css?v=20261027j" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../elementos/css/pro.css?v=20261027j" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finanzas" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../elementos/img/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../elementos/img/icon-192.png" />
</head>
<body data-seccion="agenda">

  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <div class="agenda-page">

    <a href="mas.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Más</a>

    <!-- Cabecera + controles -->
    <div class="balance-card glass">
      <div class="balance-head">
        <div class="cuentas-header-icon"><i class="fa-solid fa-calendar-check"></i></div>
        <div class="cuentas-header-text">
          <h1>Agenda</h1>
          <p>Planificación profesional</p>
        </div>
        <span class="balance-mes-label" id="agHoyBadge">Hoy</span>
      </div>

      <div class="balance-divider"></div>

      <div class="ag-tabs" role="tablist">
        <button class="ag-tab active" data-vista="dia" role="tab"><i class="fa-regular fa-calendar"></i> Día</button>
        <button class="ag-tab" data-vista="semana" role="tab"><i class="fa-solid fa-table-columns"></i> Semana</button>
        <button class="ag-tab" data-vista="mes" role="tab"><i class="fa-solid fa-table-cells"></i> Mes</button>
      </div>

      <div class="ag-nav">
        <button class="cal-nav-btn" id="agPrev" aria-label="Anterior"><i class="fa-solid fa-chevron-left"></i></button>
        <span class="ag-nav-label" id="agNavLabel">Hoy</span>
        <button class="cal-nav-btn" id="agNext" aria-label="Siguiente"><i class="fa-solid fa-chevron-right"></i></button>
        <button class="ag-hoy" id="agHoy" type="button">Hoy</button>
      </div>

      <div class="ag-stats">
        <div class="ag-stat"><span class="ag-stat-label">Hoy</span><span class="ag-stat-val" id="agStatHoy">0</span></div>
        <div class="ag-stat"><span class="ag-stat-label">Esta semana</span><span class="ag-stat-val" id="agStatSemana">0</span></div>
        <div class="ag-stat"><span class="ag-stat-label">Tareas pend.</span><span class="ag-stat-val pend" id="agStatPend">0</span></div>
      </div>
    </div>

    <!-- Vista (día / semana / mes) -->
    <div id="agVista"></div>

  </div>

  <!-- Nav inferior -->
  <div class="nav-wrapper">
    <nav class="bottom-nav glass">
      <a href="../index.html" class="nav-item" data-page="cuentas">
        <i class="fa-solid fa-wallet nav-icon"></i>
        <span class="nav-label">Cuentas</span>
      </a>
      <a href="ingresos.html" class="nav-item" data-page="ingresos">
        <i class="fa-solid fa-arrow-trend-up nav-icon"></i>
        <span class="nav-label">Ingresos</span>
      </a>
      <div class="nav-spacer"></div>
      <a href="gastos.html" class="nav-item" data-page="gastos">
        <i class="fa-solid fa-arrow-trend-down nav-icon"></i>
        <span class="nav-label">Gastos</span>
      </a>
      <a href="mas.html" class="nav-item active" data-page="mas">
        <i class="fa-solid fa-grip nav-icon"></i>
        <span class="nav-label">Más</span>
      </a>
    </nav>

    <button class="fab" id="fabBtn" aria-label="Nuevo evento">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <!-- Modal FAB (respaldo; en esta pantalla el + abre directo "Nuevo evento") -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal-sheet glass" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-handle"></div>
      <p class="modal-eyebrow">Crear nuevo</p>
      <h2 class="modal-title" id="modalTitle">¿Qué deseas registrar?</h2>
      <p class="modal-subtitle">Selecciona qué deseas crear</p>
      <div class="modal-options">
        <button class="modal-option option-ingreso" id="optIngreso">
          <span class="option-icon-wrap"><i class="fa-solid fa-arrow-trend-up"></i></span>
          <span class="option-text"><span class="option-label">Ingreso</span><span class="option-desc">Dinero que entra</span></span>
          <i class="fa-solid fa-chevron-right option-arrow"></i>
        </button>
        <button class="modal-option option-gasto" id="optGasto">
          <span class="option-icon-wrap"><i class="fa-solid fa-arrow-trend-down"></i></span>
          <span class="option-text"><span class="option-label">Gasto</span><span class="option-desc">Dinero que sale</span></span>
          <i class="fa-solid fa-chevron-right option-arrow"></i>
        </button>
      </div>
      <button class="modal-cancel" id="modalCancel">Cancelar</button>
    </div>
  </div>

  <script type="module" src="../elementos/js/app.js?v=20261027j"></script>
  <script type="module" src="../elementos/js/agenda.js?v=20261027j"></script>
</body>
</html>
